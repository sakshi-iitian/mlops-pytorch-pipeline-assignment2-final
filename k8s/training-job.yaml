apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/configs/training_config.yaml
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true
            - name: dataset-storage
              mountPath: /app/data
            - name: checkpoint-storage
              mountPath: /app/checkpoints
      volumes:
        - name: training-config
          configMap:
            name: training-config
        - name: dataset-storage
          persistentVolumeClaim:
            claimName: data-storage-pvc
        - name: checkpoint-storage
          persistentVolumeClaim:
            claimName: model-storage-pvc
